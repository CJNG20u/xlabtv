# xLab TV: remote buttons that apps don't understand, made into keys they do.
# Installed as /etc/keyd/xlab-tv.conf by install.sh (only if keyd has no other config).
[ids]
*

[main]
# "Back" on TV/air-mouse remotes -> Esc, which every app treats as back
back = esc
# "Home" -> F20, which the xLab TV GNOME extension turns into "show the launcher"
homepage = f20
