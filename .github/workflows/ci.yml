name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 xlabtv/server.py --config apps.example.json --check
      - name: Installed copy runs (same files install.sh copies)
        run: |
          d=$(mktemp -d)
          install -m 0644 xlabtv/*.py xlabtv/*.json xlabtv/*.html "$d/"
          cd / && python3 "$d/server.py" --config "$GITHUB_WORKSPACE/apps.example.json" --check
      - run: sh -n install.sh && sh -n session/xlab-tv-kiosk
      - name: GNOME extension is well-formed
        run: |
          python3 -c "import json; m = json.load(open('gnome-extension/xlab-tv@xlab.tv/metadata.json')); assert m['uuid'] == 'xlab-tv@xlab.tv'"
          glib-compile-schemas --strict --dry-run gnome-extension/xlab-tv@xlab.tv/schemas
          node --check gnome-extension/xlab-tv@xlab.tv/extension.js
      - name: Phone remote creates its virtual keyboard and mouse
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-evdev >/dev/null
          sudo modprobe uinput
          cd xlabtv && sudo /usr/bin/python3 -c "
          import remote
          b = remote._evdev_backend()
          b.tap('KEY_A'); b.tap('KEY_1', True); b.move(5, -5); b.click('left'); b.scroll(1)
          for k in remote.KEYS.values(): b.tap(k)
          print('virtual input ok')"
      - name: Window opens the launcher page
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-4.0 gir1.2-webkit-6.0 xvfb >/dev/null
          python3 xlabtv/server.py --config apps.example.json --port 8765 &
          sleep 1
          code=0; timeout 15 xvfb-run -a /usr/bin/python3 xlabtv/window.py http://127.0.0.1:8765/ || code=$?
          # still running after 15 s (exit 124) means it started and stayed up
          test "$code" -eq 124
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: dist
